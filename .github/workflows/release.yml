name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    # Forks keep their own tags; only the upstream repo publishes releases.
    if: ${{ github.repository == 'saminnet/flarewatch' }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Publish the CHANGELOG.md section as the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$RUNNER_TEMP/notes.md"
          awk -v heading="## ${TAG#v} - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -E "s#\]\(([^):\#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" > "$NOTES"

          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "CHANGELOG.md has no '## ${TAG#v} - <date>' section with content"
            exit 1
          fi

          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"

      - name: Rebuild flarewatch.app
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh workflow run deploy.yml --repo saminnet/flarewatch-app --ref main
