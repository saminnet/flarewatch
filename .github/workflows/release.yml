name: Release

on:
  workflow_run:
    workflows: ['CI and Deploy']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Forks keep their own releases. Only a passing CI and Deploy run for a push to main releases.
    if: >-
      github.repository == 'saminnet/flarewatch' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Find the newest dated version in CHANGELOG.md and check it has no tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # The newest dated section, so an Unreleased section merged above it does not hide it.
          HEADING=$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+ - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md || true)
          if [[ -z "$HEADING" ]]; then
            echo "CHANGELOG.md has no '## X.Y.Z - YYYY-MM-DD' section. Nothing to release."
            exit 0
          fi

          VERSION=${HEADING#'## '}
          TAG="v${VERSION%% *}"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]]; then
            echo "${TAG} is already released."
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Tag the commit and publish the CHANGELOG.md section as the release notes
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$RUNNER_TEMP/notes.md"
          awk -v heading="## ${TAG#v} - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -E "s#\]\(([^):\#][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/\1)#g" > "$NOTES"

          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "The CHANGELOG.md section for ${TAG#v} is empty."
            exit 1
          fi

          gh release create "$TAG" --target "$SHA" --title "FlareWatch ${TAG#v}" --notes-file "$NOTES"

      - name: Rebuild flarewatch.app
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh workflow run deploy.yml --repo saminnet/flarewatch-app --ref main
