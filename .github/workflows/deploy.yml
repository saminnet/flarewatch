name: CI and Deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PULUMI_DIY_BACKEND_GZIP: 'true'
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa #v1.10
        with:
          node-version: '24'
          cache: true
          run-install: true

      - name: Restore task cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'vite.config.ts', 'apps/status-page/vite.config.ts', 'apps/status-page/vitest.config.ts', 'services/worker/vitest.config.ts', 'packages/shared/vitest.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-task-

      - name: Check formatting and types
        timeout-minutes: 5
        run: vp check

      - name: Run unit tests
        timeout-minutes: 5
        run: vp run test

      - name: Restore browser cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'apps/status-page/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium for browser tests
        timeout-minutes: 10
        run: vp exec --filter status-page -- playwright install --with-deps --only-shell chromium

      - name: Run status page browser tests
        timeout-minutes: 10
        run: vp exec --filter status-page -- playwright test

      - name: Upload browser test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/status-page/playwright-report
            apps/status-page/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build worker for pull requests
        if: ${{ github.event_name == 'pull_request' && success() }}
        timeout-minutes: 5
        run: vp run --filter worker build

      - name: Build packages for deployment
        if: ${{ github.event_name != 'pull_request' && success() }}
        timeout-minutes: 10
        run: vp run build

      - name: Upload build outputs
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flarewatch-build-${{ github.sha }}
          path: |
            apps/status-page/dist
            services/worker/dist
          if-no-files-found: error
          retention-days: 1

  build-and-deploy:
    name: Deploy to Cloudflare
    if: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=()

          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${AWS_ACCESS_KEY_ID}" ] && missing+=(R2_ACCESS_KEY_ID)
          [ -z "${AWS_SECRET_ACCESS_KEY}" ] && missing+=(R2_SECRET_ACCESS_KEY)
          [ -z "${PULUMI_CONFIG_PASSPHRASE}" ] && missing+=(PULUMI_CONFIG_PASSPHRASE)

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets:"
            for key in "${missing[@]}"; do
              echo "- $key"
            done
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa #v1.10
        with:
          node-version: '24'
          cache: true
          run-install: true

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flarewatch-build-${{ github.sha }}
          path: .

      - name: Set project variables
        shell: bash
        run: |
          RAW_SLUG="$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/^-+|-+$//g' | sed -E 's/-+/-/g')"
          if [ -z "$RAW_SLUG" ]; then
            RAW_SLUG="flarewatch"
          fi

          MAX_LEN=50
          if [ ${#RAW_SLUG} -gt $MAX_LEN ]; then
            HASH="$(echo -n "$RAW_SLUG" | sha1sum | cut -c1-8)"
            PREFIX_LEN=$((MAX_LEN - 9))
            PREFIX="$(echo -n "${RAW_SLUG:0:$PREFIX_LEN}" | sed -E 's/-+$//')"
            PROJECT_NAME="${PREFIX}-${HASH}"
          else
            PROJECT_NAME="$RAW_SLUG"
          fi
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "PULUMI_BACKEND_URL=s3://$PROJECT_NAME-pulumi-state?endpoint=https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com&region=auto" >> "$GITHUB_ENV"

      - name: Ensure R2 bucket exists
        shell: bash
        run: |
          set +e
          OUTPUT="$(vp exec --filter status-page -- wrangler r2 bucket create "$PROJECT_NAME-pulumi-state" 2>&1)"
          EXIT_CODE="$?"
          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "$OUTPUT"
            exit 0
          fi

          if echo "$OUTPUT" | grep -q "code: 10004"; then
            echo "R2 bucket already exists: $PROJECT_NAME-pulumi-state"
            exit 0
          fi

          echo "$OUTPUT"
          exit "$EXIT_CODE"

      - name: Setup Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          pulumi-version-file: .pulumi.version

      - name: Deploy with Pulumi
        env:
          FLAREWATCH_PROXY_TOKEN: ${{ secrets.FLAREWATCH_PROXY_TOKEN }}
          FLAREWATCH_STATUS_PAGE_BASIC_AUTH: ${{ secrets.FLAREWATCH_STATUS_PAGE_BASIC_AUTH }}
          FLAREWATCH_ADMIN_BASIC_AUTH: ${{ secrets.FLAREWATCH_ADMIN_BASIC_AUTH }}
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          CUSTOM_DOMAIN_ZONE_ID: ${{ secrets.CUSTOM_DOMAIN_ZONE_ID }}
        run: |
          set_secret() { if [ -n "$2" ]; then pulumi -C infra config set --secret "$1" "$2"; fi; }
          set_config() { if [ -n "$2" ]; then pulumi -C infra config set "$1" "$2"; fi; }

          pulumi -C infra login "$PULUMI_BACKEND_URL"
          pulumi -C infra stack select production --create

          pulumi -C infra config set accountId "$CLOUDFLARE_ACCOUNT_ID"
          pulumi -C infra config set projectName "$PROJECT_NAME"
          set_secret proxyToken "$FLAREWATCH_PROXY_TOKEN"
          set_secret statusPageBasicAuth "$FLAREWATCH_STATUS_PAGE_BASIC_AUTH"
          set_secret adminBasicAuth "$FLAREWATCH_ADMIN_BASIC_AUTH"
          set_config customDomain "$CUSTOM_DOMAIN"
          set_config customDomainZoneId "$CUSTOM_DOMAIN_ZONE_ID"

          pulumi -C infra up --yes
