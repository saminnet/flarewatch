minimumReleaseAge: 1440

packages:
  - apps/*
  - packages/*
  - services/*

allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
  msw: true
  protobufjs: true

catalog:
  '@cloudflare/workers-types': 5.20261013.1
  '@tailwindcss/vite': 4.3.3
  '@tanstack/devtools-vite': 0.8.5
  '@tanstack/react-query': 5.104.2
  '@tanstack/react-router': 1.170.44
  '@tanstack/react-router-ssr-query': 1.167.3
  '@tanstack/react-start': 1.169.1
  '@types/node': 26.6.5
  date-fns: 4.4.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  wrangler: 4.150.0
  zod: 4.6.7
  vite-plus: 1.2.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
