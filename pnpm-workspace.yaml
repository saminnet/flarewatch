minimumReleaseAge: 1440

packages:
  - apps/*
  - packages/*
  - services/*

allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
  msw: true
  protobufjs: true

catalog:
  '@cloudflare/workers-types': 5.20260829.1
  '@tailwindcss/vite': 4.3.3
  '@tanstack/devtools-vite': 0.8.5
  '@tanstack/react-devtools': 0.10.8
  '@tanstack/react-query': 5.102.8
  '@tanstack/react-router': 1.170.32
  '@tanstack/react-router-devtools': 1.167.0
  '@tanstack/react-router-ssr-query': 1.167.2
  '@tanstack/react-start': 1.168.49
  '@tanstack/router-plugin': 1.168.19
  '@types/node': 26.4.0
  date-fns: 4.4.0
  i18next: 26.4.0
  react: 19.2.8
  react-dom: 19.2.8
  react-i18next: 17.0.12
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  wrangler: 4.108.0
  zod: 4.5.4
  vite-plus: 0.3.2
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
