<svg xmlns="http://www.w3.org/2000/svg" class="fw-how" width="1200" height="640" viewBox="0 40 1200 640" role="img" aria-labelledby="fw-how-title fw-how-desc">
  <title id="fw-how-title">How FlareWatch works</title>
  <desc id="fw-how-desc">Everything runs in your Cloudflare account. The monitor Worker runs every minute. It checks your sites, APIs and domains, saves the results in a Durable Object, and sends alerts when something goes down or comes back up. Visitors who subscribe get the same news by email. Your scheduled jobs ping the status page Worker when they finish. The status page Worker reads the Durable Object through the monitor Worker and serves the status page. Visitors see what you publish, and you sign in to see everything. Checks can also run from other regions or private networks through Globalping, your own proxy or Workers VPC, and a failing check can be confirmed there before it counts.</desc>
  <defs>
    <marker id="fw-how-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow-head" d="M1 1.5 L8.5 5 L1 8.5"/>
    </marker>
    <style>
      .fw-how {
        --bg: #ffffff; --area: #f6f7f8; --panel: #ffffff; --border: #d8dee4; --rule: #eaeef2;
        --text: #1f2328; --muted: #59636e; --accent: #e8710a;
        --up: #1a7f37; --up-soft: #dafbe1; --up-edge: #aceebb; --warn: #bf8700; --down: #cf222e;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        .fw-how {
          --bg: #0d1117; --area: #151b23; --panel: #0d1117; --border: #3d444d; --rule: #262c36;
          --text: #f0f6fc; --muted: #9198a1; --accent: #f0883e;
          --up: #3fb950; --up-soft: #0f2a1a; --up-edge: #1f5130; --warn: #d29922; --down: #f85149;
        }
      }
      .fw-how text { font-family: var(--font); fill: var(--text); }
      .fw-how .bg { fill: var(--bg); stroke: var(--rule); }
      .fw-how .area { fill: var(--area); stroke: var(--border); stroke-dasharray: 6 5; }
      .fw-how .panel { fill: var(--panel); stroke: var(--border); }
      .fw-how .optional-box { stroke-dasharray: 5 4; }
      .fw-how .eyebrow { font-size: 14px; font-weight: 600; fill: var(--muted); }
      .fw-how .h { font-size: 18px; font-weight: 600; }
      .fw-how .body { font-size: 15px; fill: var(--muted); }
      .fw-how .small { font-size: 14px; fill: var(--muted); }
      .fw-how .mono { font-family: var(--mono); font-size: 13.5px; fill: var(--muted); }
      .fw-how .label { font-size: 14px; font-weight: 500; fill: var(--muted); }
      .fw-how .row { font-size: 13px; font-weight: 500; }
      .fw-how .button { font-size: 12px; font-weight: 500; }
      .fw-how .flow { fill: none; stroke: var(--muted); stroke-width: 1.5; marker-end: url(#fw-how-arrow); }
      .fw-how .optional { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .fw-how .arrow-head { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .fw-how .rule { stroke: var(--rule); }
      .fw-how .up { fill: var(--up); } .fw-how .warn { fill: var(--warn); } .fw-how .down { fill: var(--down); }
      .fw-how .pill { fill: var(--up-soft); stroke: var(--up-edge); }
      .fw-how .chip { fill: var(--panel); stroke: var(--border); }
    </style>
  </defs>

  <rect class="bg" x="0.5" y="40.5" width="1199" height="639" rx="16"/>

  <!-- Your Cloudflare account -->
  <rect class="area" x="344" y="84" width="512" height="532" rx="14"/>
  <text class="eyebrow" x="368" y="116">Your Cloudflare account</text>

  <!-- Monitor Worker -->
  <rect class="panel" x="400" y="140" width="400" height="130" rx="10"/>
  <text class="h" x="424" y="178">Monitor Worker</text>
  <text class="body" x="424" y="206">Every minute: check, save, alert</text>
  <text class="mono" x="424" y="240">cron * * * * *</text>

  <!-- Durable Object -->
  <path class="flow" d="M600 270 V322"/>
  <text class="label" x="612" y="301">saves</text>
  <rect class="panel" x="480" y="326" width="240" height="96" rx="10"/>
  <text class="h" x="504" y="362">Durable Object</text>
  <text class="body" x="504" y="392">Incidents, latency, pings</text>
  <path class="flow" d="M600 422 V470"/>
  <text class="label" x="612" y="451">reads</text>

  <!-- Status page Worker -->
  <rect class="panel" x="400" y="474" width="400" height="118" rx="10"/>
  <text class="h" x="424" y="512">Status page Worker</text>
  <text class="body" x="424" y="540">Page, API, badges, Atom feed, MCP</text>
  <text class="small" x="424" y="568">Takes pings from your jobs</text>

  <!-- Your sites and APIs -->
  <rect class="panel" x="40" y="140" width="280" height="130" rx="10"/>
  <text class="h" x="60" y="178">Your sites and APIs</text>
  <text class="body" x="60" y="206">Websites, APIs, servers</text>
  <text class="small" x="60" y="240">HTTP, TCP, DNS and domain expiry</text>
  <path class="flow" d="M400 205 H324"/>
  <text class="label" x="372" y="195" text-anchor="middle">checks</text>

  <!-- Optional check locations -->
  <path class="optional" d="M180 270 V318"/>
  <rect class="panel optional-box" x="40" y="318" width="280" height="110" rx="10"/>
  <text class="eyebrow" x="60" y="346">Optional</text>
  <text class="body" x="60" y="374">Check from other regions or private</text>
  <text class="body" x="60" y="396">networks, and confirm failures there</text>
  <text class="small" x="60" y="418">Globalping, a proxy or Workers VPC</text>

  <!-- Your scheduled jobs -->
  <rect class="panel" x="40" y="468" width="280" height="124" rx="10"/>
  <text class="h" x="60" y="506">Your scheduled jobs</text>
  <text class="body" x="60" y="534">Backups, cron, CI</text>
  <text class="small" x="60" y="568">Ping when they finish</text>
  <path class="flow" d="M320 533 H396"/>
  <text class="label" x="372" y="523" text-anchor="middle">pings</text>

  <!-- Alerts -->
  <path class="flow" d="M800 205 H896"/>
  <text class="label" x="828" y="195" text-anchor="middle">alerts</text>
  <rect class="panel" x="900" y="140" width="260" height="168" rx="10"/>
  <text class="h" x="922" y="178">Alerts</text>
  <circle class="down" cx="927" cy="204" r="4.5"/>
  <text class="body" x="940" y="209">API is down</text>
  <circle class="up" cx="927" cy="230" r="4.5"/>
  <text class="body" x="940" y="235">API is back up</text>
  <text class="small" x="922" y="266">Slack, Discord, email and more</text>
  <text class="small" x="922" y="288">Subscribers get email too</text>

  <!-- Status page preview -->
  <path class="flow" d="M800 533 H896"/>
  <text class="label" x="828" y="523" text-anchor="middle">serves</text>
  <rect class="panel" x="900" y="340" width="260" height="258" rx="10"/>
  <text x="922" y="371" style="font-size:14px;font-weight:600;">Example status</text>
  <rect class="chip" x="1066" y="354" width="76" height="24" rx="6"/>
  <text class="button" x="1104" y="370" text-anchor="middle">Get updates</text>
  <path class="rule" d="M900 388 H1160"/>
  <rect class="pill" x="920" y="400" width="220" height="36" rx="8"/>
  <circle class="up" cx="938" cy="418" r="5"/>
  <text x="952" y="423" style="font-size:14px;font-weight:600;">All systems operational</text>

  <text class="row" x="922" y="462">Website</text>
  <text class="small" x="1138" y="462" text-anchor="end">99.98%</text>
