    <rect class="up" x="70" width="5" height="18" rx="1.5"/><rect class="up" x="77" width="5" height="18" rx="1.5"/><rect class="up" x="84" width="5" height="18" rx="1.5"/><rect class="up" x="91" width="5" height="18" rx="1.5"/><rect class="up" x="98" width="5" height="18" rx="1.5"/><rect class="up" x="105" width="5" height="18" rx="1.5"/><rect class="up" x="112" width="5" height="18" rx="1.5"/><rect class="up" x="119" width="5" height="18" rx="1.5"/><rect class="up" x="126" width="5" height="18" rx="1.5"/><rect class="up" x="133" width="5" height="18" rx="1.5"/>
    <rect class="up" x="140" width="5" height="18" rx="1.5"/><rect class="warn" x="147" width="5" height="18" rx="1.5"/><rect class="up" x="154" width="5" height="18" rx="1.5"/><rect class="up" x="161" width="5" height="18" rx="1.5"/><rect class="up" x="168" width="5" height="18" rx="1.5"/><rect class="up" x="175" width="5" height="18" rx="1.5"/><rect class="up" x="182" width="5" height="18" rx="1.5"/><rect class="up" x="189" width="5" height="18" rx="1.5"/><rect class="up" x="196" width="5" height="18" rx="1.5"/><rect class="up" x="203" width="5" height="18" rx="1.5"/>
  </g>

  <text class="row" x="922" y="514">API</text>
  <text class="small" x="1138" y="514" text-anchor="end">99.71%</text>
  <g transform="translate(922 522)">
    <rect class="up" x="0" width="5" height="18" rx="1.5"/><rect class="up" x="7" width="5" height="18" rx="1.5"/><rect class="up" x="14" width="5" height="18" rx="1.5"/><rect class="up" x="21" width="5" height="18" rx="1.5"/><rect class="up" x="28" width="5" height="18" rx="1.5"/><rect class="up" x="35" width="5" height="18" rx="1.5"/><rect class="up" x="42" width="5" height="18" rx="1.5"/><rect class="up" x="49" width="5" height="18" rx="1.5"/><rect class="warn" x="56" width="5" height="18" rx="1.5"/><rect class="up" x="63" width="5" height="18" rx="1.5"/>
    <rect class="up" x="70" width="5" height="18" rx="1.5"/><rect class="up" x="77" width="5" height="18" rx="1.5"/><rect class="up" x="84" width="5" height="18" rx="1.5"/><rect class="up" x="91" width="5" height="18" rx="1.5"/><rect class="up" x="98" width="5" height="18" rx="1.5"/><rect class="up" x="105" width="5" height="18" rx="1.5"/><rect class="up" x="112" width="5" height="18" rx="1.5"/><rect class="up" x="119" width="5" height="18" rx="1.5"/><rect class="up" x="126" width="5" height="18" rx="1.5"/><rect class="up" x="133" width="5" height="18" rx="1.5"/>
    <rect class="up" x="140" width="5" height="18" rx="1.5"/><rect class="up" x="147" width="5" height="18" rx="1.5"/><rect class="up" x="154" width="5" height="18" rx="1.5"/><rect class="up" x="161" width="5" height="18" rx="1.5"/><rect class="up" x="168" width="5" height="18" rx="1.5"/><rect class="down" x="175" width="5" height="18" rx="1.5"/><rect class="up" x="182" width="5" height="18" rx="1.5"/><rect class="up" x="189" width="5" height="18" rx="1.5"/><rect class="up" x="196" width="5" height="18" rx="1.5"/><rect class="up" x="203" width="5" height="18" rx="1.5"/>
  </g>

  <path class="rule" d="M920 556 H1140"/>
  <text class="small" x="922" y="580">Sign in to see everything</text>

  <text class="small" x="40" y="652">Monitors and page settings live in packages/config. Push to main and GitHub Actions deploys both Workers.</text>
</svg>
