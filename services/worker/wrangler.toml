# Wrangler configuration for monitoring worker.

name = "flarewatch-worker"
main = "src/index.ts"
compatibility_date = "2025-11-17"
compatibility_flags = []

# The trigger endpoint is only for the status page's service binding — never expose it publicly.
workers_dev = false

# CI creates/adopts the flarewatch-state namespace and replaces this placeholder before deploy.
kv_namespaces = [{ binding = "FLAREWATCH_STATE", id = "__FLAREWATCH_STATE_KV_NAMESPACE_ID__" }]

[triggers]
crons = ["* * * * *"]
