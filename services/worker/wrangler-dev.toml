name = "flarewatch-worker"
main = "src/index.ts"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
# Same as wrangler.toml, so a deploy with this file by mistake stays off the public internet.
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "MONITOR_HUB"
class_name = "MonitorHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonitorHub"]

[[ratelimits]]
name = "HEARTBEAT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
